name: Listing readiness feedback

on:
  pull_request_target:
    types: [opened, synchronize, reopened]
    paths:
      - "intents/*.json"

permissions:
  contents: read
  pull-requests: write
  issues: write

concurrency:
  group: orbital-readiness-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  evaluate:
    runs-on: ubuntu-latest
    steps:
      - name: Check out trusted evaluator from base
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false

      - name: Set up Node
        uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Install trusted evaluator dependencies
        run: npm install --ignore-scripts

      - name: Evaluate changed listing intents
        uses: actions/github-script@v7
        env:
          OUTPUT_DIR: readiness-output
          MAX_FILE_BYTES: "262144"
          MAX_INTENTS_PER_PR: "5"
        with:
          script: |
            const fs = require("fs");
            const path = require("path");
            const { evaluateListingIntentBundle, validateIntent } = require("./lib/readiness");
            const { createReadinessArtifact } = require("./lib/readiness-artifact");
            const {
              readinessMarker,
              renderInvalidIntentComment,
              renderReadinessComment
            } = require("./lib/readiness-comment");

            const owner = context.repo.owner;
            const repo = context.repo.repo;
            const pr = context.payload.pull_request;
            const outputDir = process.env.OUTPUT_DIR;
            const maxFileBytes = Number(process.env.MAX_FILE_BYTES || 262144);
            const maxIntents = Number(process.env.MAX_INTENTS_PER_PR || 5);
            const runAttempt = Number(process.env.GITHUB_RUN_ATTEMPT || "1");
            const runUrl = `https://github.com/${owner}/${repo}/actions/runs/${context.runId}`;

            fs.mkdirSync(outputDir, { recursive: true });

            const changedFiles = await github.paginate(github.rest.pulls.listFiles, {
              owner,
              repo,
              pull_number: pr.number,
              per_page: 100
            });

            const candidates = changedFiles.filter((file) =>
              /^intents\/[^/]+\.json$/u.test(file.filename) && file.status !== "removed"
            );

            if (candidates.length === 0) {
              core.notice("No changed intents/*.json files to evaluate.");
              return;
            }

            if (candidates.length > maxIntents) {
              core.setFailed(
                `This workflow evaluates at most ${maxIntents} intent files per PR; found ${candidates.length}. Split the submission into smaller PRs.`
              );
              return;
            }

            if (!pr.head.repo) {
              core.setFailed("The pull request head repository is unavailable.");
              return;
            }

            const comments = await github.paginate(github.rest.issues.listComments, {
              owner,
              repo,
              issue_number: pr.number,
              per_page: 100
            });

            async function upsertComment(filename, body) {
              const marker = readinessMarker(filename);
              const existing = comments.find(
                (comment) =>
                  comment.user?.type === "Bot" &&
                  typeof comment.body === "string" &&
                  comment.body.includes(marker)
              );

              if (existing) {
                await github.rest.issues.updateComment({
                  owner,
                  repo,
                  comment_id: existing.id,
                  body
                });
              } else {
                const created = await github.rest.issues.createComment({
                  owner,
                  repo,
                  issue_number: pr.number,
                  body
                });
                comments.push(created.data);
              }
            }

            for (const file of candidates) {
              let applicantName = "unknown";

              try {
                const response = await github.rest.repos.getContent({
                  owner: pr.head.repo.owner.login,
                  repo: pr.head.repo.name,
                  path: file.filename,
                  ref: pr.head.sha
                });

                const content = response.data;
                if (Array.isArray(content) || !content.content) {
                  await upsertComment(
                    file.filename,
                    renderInvalidIntentComment(file.filename, applicantName, [
                      { instancePath: "/", message: "intent path did not resolve to a regular JSON file" }
                    ])
                  );
                  continue;
                }

                if ((content.size || 0) > maxFileBytes) {
                  await upsertComment(
                    file.filename,
                    renderInvalidIntentComment(file.filename, applicantName, [
                      {
                        instancePath: "/",
                        message: `file exceeds the ${maxFileBytes}-byte public intake limit`
                      }
                    ])
                  );
                  continue;
                }

                const decoded = Buffer.from(content.content, "base64").toString("utf8");
                let intent;
                try {
                  intent = JSON.parse(decoded);
                  applicantName = intent?.agent?.name || applicantName;
                } catch (error) {
                  await upsertComment(
                    file.filename,
                    renderInvalidIntentComment(file.filename, applicantName, [
                      { instancePath: "/", message: `invalid JSON: ${error.message}` }
                    ])
                  );
                  continue;
                }

                const validation = validateIntent(intent);
                if (!validation.valid) {
                  await upsertComment(
                    file.filename,
                    renderInvalidIntentComment(file.filename, applicantName, validation.errors)
                  );
                  continue;
                }

                const bundle = evaluateListingIntentBundle(intent);
                const eligibilityAssessment = bundle.eligibility_assessment;
                const readiness = bundle.readiness_response;
                const readinessArtifact = createReadinessArtifact(readiness, {
                  environment: "github-actions",
                  source_commit: pr.base.sha,
                  source_ref: pr.base.ref,
                  run_id: String(context.runId),
                  run_attempt: runAttempt
                });
                const slug = path
                  .basename(file.filename, ".json")
                  .replace(/[^A-Za-z0-9._-]/g, "_")
                  .slice(0, 100);

                fs.writeFileSync(
                  path.join(outputDir, `${slug}.eligibility.json`),
                  `${JSON.stringify(eligibilityAssessment, null, 2)}\n`,
                  "utf8"
                );
                fs.writeFileSync(
                  path.join(outputDir, `${slug}.readiness.json`),
                  `${JSON.stringify(readiness, null, 2)}\n`,
                  "utf8"
                );
                fs.writeFileSync(
                  path.join(outputDir, `${slug}.readiness-artifact.json`),
                  `${JSON.stringify(readinessArtifact, null, 2)}\n`,
                  "utf8"
                );

                await upsertComment(
                  file.filename,
                  renderReadinessComment(
                    file.filename,
                    intent,
                    readiness,
                    runUrl,
                    eligibilityAssessment
                  )
                );
              } catch (error) {
                core.error(`Failed to evaluate ${file.filename}: ${error.stack || error.message}`);
                await upsertComment(
                  file.filename,
                  renderInvalidIntentComment(file.filename, applicantName, [
                    {
                      instancePath: "/",
                      message: "the trusted evaluator encountered an internal error; no readiness conclusion was produced"
                    }
                  ])
                );
                core.setFailed(`Evaluation failed for ${file.filename}.`);
              }
            }

      - name: Upload machine-readable readiness responses
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: listing-readiness-responses-pr-${{ github.event.pull_request.number }}
          path: readiness-output/*.json
          if-no-files-found: ignore
          retention-days: 30
